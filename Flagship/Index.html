<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flagship | Instituto Delyone</title>

  <link rel="apple-touch-icon" href="/assets/icon-512.png">
  <link rel="icon" type="image/png" href="/assets/icon-512.png">
  <meta name="theme-color" content="#02050a">

  <style>
:root{
  --deep:#02050a;
  --navy:#071426;
  --blue:#1f5fae;
  --glass:rgba(255,255,255,.075);
  --line:rgba(180,212,255,.22);
  --text:#f5f7fb;
  --muted:rgba(245,247,251,.68);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--text);
  background:#02050a;
  overflow-x:hidden;
}

.flagship{
  position:relative;
  min-height:100vh;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  isolation:isolate;
}

.flagship::before{
  content:"";
  position:fixed;
  inset:-24px;
  z-index:-3;
  background:
    radial-gradient(circle at 50% 20%, rgba(46,123,216,.18), transparent 24rem),
    linear-gradient(180deg, rgba(2,5,10,.12), rgba(2,5,10,.88)),
    url("/assets/flagship-bg.png") center/cover no-repeat;
  filter:blur(7px) saturate(.86) brightness(.72);
  transform:scale(1.035);
}

.flagship::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 50% 18%, rgba(46,123,216,.16), transparent 24rem),
    linear-gradient(180deg, rgba(2,5,10,.26), rgba(2,5,10,.76));
}

.card{
  width:min(920px,100%);
  min-height:min(860px,92vh);
  position:relative;
  padding:clamp(24px,5vw,58px);
  border-radius:38px;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.032));
  border:1px solid rgba(180,212,255,.25);
  box-shadow:
    0 32px 100px rgba(0,0,0,.42),
    inset 0 0 0 1px rgba(255,255,255,.035);
  backdrop-filter:blur(18px);
}

.symbol{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.34;
  z-index:0;
}

.symbol::before{
  content:"";
  position:absolute;
  left:50%;
  top:18%;
  width:min(520px,76vw);
  height:min(520px,76vw);
  transform:translateX(-50%);
  border:1px solid rgba(180,212,255,.20);
  border-radius:50%;
  box-shadow:
    0 0 0 70px rgba(180,212,255,.025),
    0 0 80px rgba(46,123,216,.08);
}

.symbol::after{
  content:"";
  position:absolute;
  left:50%;
  top:8%;
  width:min(660px,88vw);
  height:min(660px,88vw);
  transform:translateX(-50%) rotate(45deg);
  border:1px solid rgba(180,212,255,.10);
}

.drop{
  position:absolute;
  left:50%;
  top:15%;
  width:min(280px,42vw);
  height:min(360px,54vw);
  transform:translateX(-50%);
  opacity:.42;
}

.drop::before,
.drop::after{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:44%;
  height:100%;
  border:3px solid rgba(222,236,255,.42);
  border-bottom:0;
  filter:drop-shadow(0 0 14px rgba(142,190,255,.18));
}

.drop::before{
  transform:translateX(-50%) skewX(-22deg);
  border-right:0;
  border-radius:70% 0 0 0;
}

.drop::after{
  transform:translateX(-50%) skewX(22deg);
  border-left:0;
  border-radius:0 70% 0 0;
}

.content{
  position:relative;
  z-index:2;
  min-height:calc(min(860px,92vh) - 116px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.logo{
  width:min(150px,40vw);
  margin-bottom:22px;
  opacity:.88;
  filter:drop-shadow(0 18px 36px rgba(0,0,0,.35));
}

.kicker{
  margin:0 0 14px;
  letter-spacing:.32em;
  text-transform:uppercase;
  font-size:.75rem;
  color:rgba(225,236,255,.70);
}

h1{
  margin:0;
  font-size:clamp(3rem,12vw,6.2rem);
  line-height:.92;
  letter-spacing:.18em;
  font-weight:400;
  color:rgba(235,228,214,.88);
  text-transform:uppercase;
  text-shadow:0 0 30px rgba(46,123,216,.12);
}

.subtitle{
  margin:20px auto 0;
  max-width:680px;
  color:var(--muted);
  font-size:clamp(1rem,3.6vw,1.25rem);
  line-height:1.65;
}

.actions{
  width:min(620px,100%);
  margin:34px auto 0;
  display:grid;
  gap:14px;
}

.button{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  text-decoration:none;
  font-weight:700;
  color:#fff;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(180,212,255,.24);
  box-shadow:0 18px 42px rgba(0,0,0,.18);
  backdrop-filter:blur(12px);
}

.button.primary{
  background:linear-gradient(135deg,rgba(46,123,216,.82),rgba(31,95,174,.54));
}

.diagnosis-link{
  margin-top:34px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  text-decoration:none;
  text-transform:uppercase;
  letter-spacing:.32em;
  color:rgba(222,236,255,.72);
  font-size:clamp(.92rem,3.4vw,1.12rem);
}

.diagnosis-link strong{
  display:block;
  margin-top:4px;
  font-size:clamp(1.55rem,6vw,2.35rem);
  font-weight:500;
  letter-spacing:.36em;
}

.footer-note{
  position:absolute;
  left:50%;
  bottom:28px;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  letter-spacing:.28em;
  text-transform:uppercase;
  font-size:.7rem;
  color:rgba(225,236,255,.54);
}

.easter{
  position:absolute;
  right:30px;
  bottom:28px;
  z-index:4;
  text-decoration:none;
  letter-spacing:.32em;
  color:rgba(142,190,255,.62);
  font-size:1.3rem;
}

@media(max-width:760px){
  .flagship{
    padding:14px;
    align-items:flex-start;
  }

  .card{
    min-height:92vh;
    border-radius:30px;
  }

  .content{
    justify-content:center;
    padding-bottom:54px;
  }

  .drop{
    top:18%;
    width:220px;
    height:300px;
    opacity:.36;
  }

  .symbol::before{
    top:20%;
  }
}
  </style>
</head>

<body>
  <main class="flagship">
    <section class="card" aria-label="Flagship page do Instituto Delyone">
      <div class="symbol" aria-hidden="true">
        <div class="drop"></div>
      </div>

      <div class="content">
        <img class="logo" src="/assets/logo-idmt.png" alt="Instituto Delyone">

        <p class="kicker">Instituto Delyone</p>

        <h1>Flagship</h1>

        <p class="subtitle">
          Visão sintética da identidade, missão e portas principais do Instituto Delyone de Medicina e Tecnologia.
        </p>

        <nav class="actions" aria-label="Navegação principal">
          <a class="button primary" href="/sobre.html">Explorar estrutura institucional</a>
          <a class="button" href="/pesquisas/">Pesquisas e projetos</a>
          <a class="button primary" href="/contato/">Enviar proposta para análise</a>
        </nav>

        <a class="diagnosis-link" href="/pesquisas/">
          <span>abrir sistema</span>
          <strong>Diagnosis</strong>
        </a>
      </div>

      <p class="footer-note">powered by Aurora</p>

      <a class="easter" href="/loja/" aria-label="Easter egg experimental">•••</a>
    </section>
  </main>
</body>
</html>
